<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Run Generator - Shadowrun Anarchy 2.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&family=Roboto+Mono:wght@400;700&family=Roboto:wght@400;500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --yellow: #FFC107;
  --yellow-dark: #E5AC00;
  --yellow-light: #FFE082;
  --gray-light: #E0E0E0;
  --gray-mid: #9E9E9E;
  --gray-dark: #424242;
  --black: #212121;
  --white: #FFFFFF;
  --bg: #E8E8E8;
  --paper: #FFFFFF;
  --paper-dark: #E8E0D0;
  --success: #43A047;
  --danger: #E53935;
}

body {
  font-family: 'Roboto', sans-serif;
  background-color: var(--bg);
  background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 10 L35 10 L35 35' stroke='%23BDBDBD' stroke-width='1' fill='none'/%3E%3Cpath d='M60 10 L85 10 L85 60 L110 60' stroke='%23BDBDBD' stroke-width='1' fill='none'/%3E%3Cpath d='M10 60 L10 85 L35 85' stroke='%23BDBDBD' stroke-width='1' fill='none'/%3E%3Cpath d='M60 85 L85 85 L85 110' stroke='%23BDBDBD' stroke-width='1' fill='none'/%3E%3Ccircle cx='35' cy='35' r='2.5' fill='%23BDBDBD'/%3E%3Ccircle cx='85' cy='60' r='2.5' fill='%23BDBDBD'/%3E%3Ccircle cx='35' cy='85' r='2.5' fill='%23BDBDBD'/%3E%3Ccircle cx='85' cy='110' r='2.5' fill='%23BDBDBD'/%3E%3C/svg%3E");
  padding: 80px 16px 40px;
  color: var(--black);
  min-height: 100vh;
}

/* ===== TOOLBAR ===== */
.toolbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  min-height: 60px;
  background: var(--black);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px 16px;
  z-index: 1000;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.toolbar-btn {
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 18px;
  border: 2px solid var(--yellow);
  border-radius: 4px;
  background: var(--yellow);
  color: var(--black);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.toolbar-btn:hover {
  background: var(--yellow-dark);
  border-color: var(--yellow-dark);
}

.toolbar-btn.secondary {
  background: transparent;
  color: var(--yellow);
}

.toolbar-btn.secondary:hover {
  background: var(--yellow);
  color: var(--black);
}

/* ===== PAGE ===== */
.page {
  max-width: 900px;
  margin: 0 auto;
  background: var(--paper);
  padding: 14mm 16mm;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  border-radius: 4px;
}

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 20px;
  border-bottom: 3px solid var(--yellow-dark);
  padding-bottom: 8px;
}

.logo-text {
  font-family: 'Oswald', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--black);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.logo-text span { color: var(--yellow-dark); }

.subtitle {
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 12px;
  color: var(--gray-dark);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ===== RUN CARDS ===== */
.run-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.run-card {
  border: 2px solid var(--yellow-dark);
  border-radius: 4px;
  padding: 10px 12px;
  background: var(--white);
  position: relative;
  transition: opacity 0.2s, filter 0.2s;
}

.run-card.hidden-card {
  opacity: 0.35;
  filter: grayscale(0.8);
}

.run-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1.5px solid var(--yellow-dark);
}

.run-card-title {
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--black);
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.run-card-num {
  font-family: 'Roboto Mono', monospace;
  font-size: 10px;
  background: var(--black);
  color: var(--yellow);
  padding: 2px 6px;
  border-radius: 3px;
}

.run-card-actions {
  display: flex;
  gap: 6px;
}

.card-btn {
  width: 28px;
  height: 28px;
  border: 1.5px solid var(--gray-mid);
  border-radius: 4px;
  background: var(--white);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 700;
  font-family: 'Roboto Condensed', sans-serif;
  transition: all 0.15s;
}

.card-btn:hover {
  border-color: var(--yellow-dark);
  background: var(--yellow-light);
}

.card-btn.active-toggle {
  background: var(--yellow);
  border-color: var(--yellow-dark);
}

.run-card-body {
  font-family: 'Roboto', sans-serif;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--black);
}

.run-card-body .prefix {
  font-weight: 500;
  color: var(--gray-dark);
}

.run-card-body .result {
  font-weight: 700;
  color: var(--black);
}

/* Narrative block */
.narrative-block {
  background: #faf8f3;
  border: 2px solid var(--gray-mid);
  border-radius: 4px;
  padding: 14px 16px;
  margin-bottom: 16px;
  font-family: 'Roboto', sans-serif;
  font-size: 14px;
  line-height: 1.7;
  color: var(--black);
}

.narrative-block h3 {
  font-family: 'Oswald', sans-serif;
  font-size: 14px;
  text-transform: uppercase;
  margin-bottom: 8px;
  color: var(--yellow-dark);
  border-bottom: 1px solid var(--yellow-light);
  padding-bottom: 4px;
}

.narrative-text {
  font-style: italic;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 700px) {
  body { padding: 100px 10px 20px; }
  .page { padding: 8mm 10mm; }
  .toolbar { gap: 6px; padding: 8px; }
  .toolbar-btn { font-size: 11px; padding: 6px 12px; }
}

@media print {
  body { background: white; padding: 0; }
  .page { box-shadow: none; margin: 0; max-width: 100%; }
  .toolbar { display: none; }
  .run-card { break-inside: avoid; }
  .card-btn { display: none; }
}
</style>
</head>

// ==================== ÉTAT ====================
let runState = {};
let visibility = {};

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generateRunId() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  return '#RUN-' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
}

function pickFor(key) { return rand(DATA[key]); }

function generateFullRun() {
  runState = {};
  CATEGORIES.forEach(cat => {
    runState[cat.key] = pickFor(cat.key);
    visibility[cat.key] = true;
  });
  document.getElementById('run-id').textContent = generateRunId();
  render();
  buildNarrative();
}

function reroll(key) {
  runState[key] = pickFor(key);
  render();
  buildNarrative();
}

function toggleVis(key) {
  visibility[key] = !visibility[key];
  render();
  buildNarrative();
}

function toggleAll(show) {
  CATEGORIES.forEach(cat => visibility[cat.key] = show);
  render();
  buildNarrative();
}

function render() {
  const grid = document.getElementById('run-grid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const val = runState[cat.key] || '-';
    const visible = visibility[cat.key] !== false;
    const card = document.createElement('div');
    card.className = 'run-card' + (visible ? '' : ' hidden-card');
    card.innerHTML = `
      <div class="run-card-header">
        <div class="run-card-title">
          <span class="run-card-num">${cat.num}</span>
          ${cat.label}
        </div>
        <div class="run-card-actions">
          <button class="card-btn ${visible ? 'active-toggle' : ''}" title="${visible ? 'Masquer' : 'Afficher'}" onclick="toggleVis('${cat.key}')">${visible ? 'MAS' : 'AFF'}</button>
          <button class="card-btn" title="Relancer cette ligne" onclick="reroll('${cat.key}')">REL</button>
        </div>
      </div>
      <div class="run-card-body">
        ${cat.template.replace('{val}', val)}
      </div>
    `;
    grid.appendChild(card);
  });
}

function buildNarrative() {
  const n = runState;
  if (!n.johnson) return;
  const text = document.getElementById('narrative-text');
  const paragraphs = [];

  // PARAGRAPHE 1 : Le contrat
  let p1 = [];
  if (visibility.johnson) {
    p1.push(`C'est <strong>${n.johnson}</strong> qui vous contacte pour ce boulot.`);
  }
  if (visibility.contexte) {
    let ctx = n.contexte;
    if (!ctx.toLowerCase().startsWith('dans') && !ctx.toLowerCase().startsWith('via') && !ctx.toLowerCase().startsWith('le') && !ctx.toLowerCase().startsWith('la') && !ctx.toLowerCase().startsWith('the') && !ctx.toLowerCase().startsWith("l'")) {
      ctx = 'dans ' + ctx;
    }
    p1.push(`Le rendez-vous se passe ${ctx}.`);
  }
  if (visibility.type_run) {
    p1.push(`La mission est une <strong>${n.type_run}</strong>.`);
  }
  if (visibility.cible) {
    p1.push(`Votre objectif : <strong>${n.cible}</strong>.`);
  }
  if (p1.length) paragraphs.push(p1.join(' '));

  // PARAGRAPHE 2 : Le terrain
  let p2 = [];
  if (visibility.lieu_general || visibility.lieu_specifique) {
    let lieu = [];
    if (visibility.lieu_general) lieu.push(n.lieu_general);
    if (visibility.lieu_specifique) lieu.push(n.lieu_specifique);
    p2.push(`L'opération se déroule <strong>${lieu.join(', plus précisément au ')}</strong>.`);
  }
  if (visibility.complication) {
    p2.push(`Mauvaise nouvelle, le site est affecté par <strong>${n.complication}</strong>.`);
  }
  if (p2.length) paragraphs.push(p2.join(' '));

  // PARAGRAPHE 3 : Les défenses
  let p3 = [];
  const hasPhys = visibility.secu_physique;
  const hasMatrix = visibility.secu_matrix;
  const hasMagie = visibility.secu_magie;
  if (hasPhys || hasMatrix || hasMagie) {
    let defs = [];
    if (hasPhys) defs.push(`côté physique, ${n.secu_physique.toLowerCase().startsWith('aucune') ? 'rien de visible' : n.secu_physique}`);
    if (hasMatrix) defs.push(`côté Matrix, ${n.secu_matrix.toLowerCase().startsWith('aucune') ? 'rien de visible' : n.secu_matrix}`);
    if (hasMagie) defs.push(`côté magie, ${n.secu_magie.toLowerCase().startsWith('aucune') ? 'rien de visible' : n.secu_magie}`);
    if (defs.length === 1) {
      p3.push(`Les défenses du site : ${defs[0]}.`);
    } else if (defs.length === 2) {
      p3.push(`Les défenses du site sont multiples, ${defs.join(' et ')}.`);
    } else {
      p3.push(`Les défenses du site sont redoutables : ${defs.join(', et ')}.`);
    }
  }
  if (p3.length) paragraphs.push(p3.join(' '));

  // PARAGRAPHE 4 : L'adversaire et le contexte local
  let p4 = [];
  if (visibility.opposition) {
    p4.push(`Vous devrez affronter <strong>${n.opposition}</strong>.`);
  }
  if (visibility.gang) {
    p4.push(`Dans le coin, le <strong>${n.gang}</strong> rôde et pourrait s'en mêler.`);
  }
  if (visibility.corporation) {
    p4.push(`En coulisses, <strong>${n.corporation}</strong> tire les ficelles.`);
  }
  if (visibility.paranimal) {
    p4.push(`Et pour corser le tout, un <strong>${n.paranimal}</strong> a été signalé dans les parages.`);
  }
  if (p4.length) paragraphs.push(p4.join(' '));

  // PARAGRAPHE 5 : Atouts et opportunités
  let p5 = [];
  if (visibility.allie) {
    p5.push(`Cependant, <strong>${n.allie}</strong> pourrait vous prêter main-forte.`);
  }
  if (visibility.faiblesse) {
    p5.push(`La cible a une faille exploitable : <strong>${n.faiblesse}</strong>.`);
  }
  if (visibility.objet_cle) {
    p5.push(`Pour accéder au cœur du site, il vous faudra mettre la main sur <strong>${n.objet_cle}</strong>.`);
  }
  if (p5.length) paragraphs.push(p5.join(' '));

  // PARAGRAPHE 6 : Contraintes et urgence
  let p6 = [];
  if (visibility.contrainte) {
    p6.push(`Le timing est serré : <strong>${n.contrainte}</strong>.`);
  }
  if (visibility.condition) {
    p6.push(`Votre employeur impose une règle d'or : <strong>${n.condition}</strong>.`);
  }
  if (visibility.enjeu) {
    p6.push(`L'urgence est réelle, <strong>${n.enjeu}</strong>.`);
  }
  if (p6.length) paragraphs.push(p6.join(' '));

  // PARAGRAPHE 7 : Twist et imprévu
  let p7 = [];
  if (visibility.twist) {
    p7.push(`<em>Mais attention… ${n.twist}</em>`);
  }
  if (visibility.evenement) {
    p7.push(`<em>Sans compter que, en pleine action, ${n.evenement.toLowerCase()}.</em>`);
  }
  if (p7.length) paragraphs.push(p7.join(' '));

  // PARAGRAPHE 8 : La récompense
  let p8 = [];
  if (visibility.recompense) {
    p8.push(`Si vous ramenez le bébé, la récompense est <strong>${n.recompense}</strong>.`);
  }
  if (p8.length) paragraphs.push(p8.join(' '));

  text.innerHTML = paragraphs.length
    ? paragraphs.map(p => `<p style="margin-bottom:10px;">${p}</p>`).join('')
    : 'Tous les éléments sont masqués. Affichez-en au moins un pour voir le résumé narratif.';
}

// Initialisation
generateFullRun();
</script>
</body>
</html>
